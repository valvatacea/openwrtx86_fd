name: OpenWrt x86_64 Auto Build + USB-ready + IPK (Non-Interactive Fixed Loop)

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      GH_PAT: ${{ secrets.GH_PAT }}

    steps:
    # ============================================================
    # 1. Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # ============================================================
    # 2. Get latest OpenWrt version
    - name: Get latest OpenWrt version
      id: get_version
      run: |
        LATEST=$(curl -s https://downloads.openwrt.org/releases/ | grep -Po '([0-9]{2}\.[0-9]{2}\.[0-9]{1,2})/' | sort -V | tail -1 | tr -d '/')
        echo "LATEST=$LATEST" >> $GITHUB_ENV
        echo "Latest OpenWrt version: $LATEST"

    # ============================================================
    # 3. Check if version already built
    - name: Check if OpenWrt version already built
      id: check_build
      uses: actions/github-script@v6
      with:
        script: |
          const version = (process.env.LATEST || "").trim();
          const releases = await github.rest.repos.listReleases({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100
          });
          const exists = releases.data.some(r => r.tag_name.includes(version));
          require('fs').appendFileSync(process.env.GITHUB_ENV, `CHECK_BUILD_RESULT=${exists ? "true" : "false"}\n`);

    # ============================================================
    # 4a. Set today's date (dipakai untuk cache key harian)
    - name: Set today's date
      id: date
      if: env.CHECK_BUILD_RESULT != 'true'
      run: |
        echo "today=$(date +%Y-%m-%d)" >> $GITHUB_ENV
    
    # ============================================================
    # 4b. Cache system dependencies (APT) - refresh tiap hari
    - name: Cache system dependencies
      id: depscache
      if: env.CHECK_BUILD_RESULT != 'true'
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/apt
          /var/cache/apt
        key: deps-cache-${{ env.today }}
        restore-keys: |
          deps-cache-
    
    # ============================================================
    # 4c. Debug informasi cache yang digunakan
    - name: Debug cache usage
      if: env.CHECK_BUILD_RESULT != 'true'
      run: |
        echo "Cache Key    : deps-cache-${{ env.today }}"
        echo "Cache Hit?   : ${{ steps.depscache.outputs.cache-hit }}"
        if [ "${{ steps.depscache.outputs.cache-hit }}" = "true" ]; then
          echo "Status       : Menggunakan cache."
        else
          echo "Status       : TIDAK menemukan cache. Menghasilkan cache baru."
        fi

    # ============================================================
    # 4d. Install dependencies
    - name: Install dependencies
      if: env.CHECK_BUILD_RESULT != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y wget xz-utils squashfs-tools \
          qemu-utils dosfstools e2fsprogs parted rsync unzip file \
          build-essential gawk python3 curl git cloud-guest-utils \
          util-linux syslinux extlinux mtools grub-pc-bin \
          bzip2 lzma binfmt-support qemu-user-static kpartx

    # ============================================================
    # 5. Download OpenWrt Image
    - name: Download OpenWrt Image
      if: env.CHECK_BUILD_RESULT != 'true'
      run: |
        cd $GITHUB_WORKSPACE
        LATEST=${{ env.LATEST }}
        IMG_URL="https://downloads.openwrt.org/releases/${LATEST}/targets/x86/64/openwrt-${LATEST}-x86-64-generic-ext4-combined.img.gz"
        IMG_NAME="openwrt-x86-64-combined-ext4.img"
        IMG_GZ="${IMG_NAME}.gz"

        echo "DEBUG: Downloading $IMG_URL"
        wget -q --show-progress "$IMG_URL" -O "$IMG_GZ"
        gunzip -f "$IMG_GZ" || true

    # ============================================================
    # 6. Debug Image Size Before Resize
    - name: Debug Image Size (Before Resize)
      if: env.CHECK_BUILD_RESULT != 'true'
      run: |
        IMG_NAME="openwrt-x86-64-combined-ext4.img"
        stat -c "File: %n | Bytes: %s" "$IMG_NAME"
        du -h "$IMG_NAME"

    # ============================================================
    # 7. Resize Image & Partition & Mount
    - name: Resize Image, Partition & Mount RootFS
      if: env.CHECK_BUILD_RESULT != 'true'
      run: |
        IMG_NAME="openwrt-x86-64-combined-ext4.img"
        TARGET_SIZE="2000M"
    
        # Attach loop device & auto map partitions
        LOOP=$(sudo losetup -f --show -P "$IMG_NAME")
        echo "Using loop device: $LOOP"
        echo "LOOP=$LOOP" >> $GITHUB_ENV
    
        # Resize raw image
        sudo qemu-img resize -f raw "$IMG_NAME" $TARGET_SIZE
    
        # Resize partition 2 to 100%
        sudo parted "${LOOP}" -s resizepart 2 100%
        sudo partprobe "${LOOP}" || true
        sleep 1
    
        # Check & resize filesystem
        sudo e2fsck -fy "${LOOP}p2" || true
        sudo resize2fs "${LOOP}p2"

    # ============================================================
    # 8. Debug Image Size After Resize
    - name: Debug Image Size (After Resize)
      if: env.CHECK_BUILD_RESULT != 'true'
      run: |
        IMG_NAME="openwrt-x86-64-combined-ext4.img"
        stat -c "File: %n | Bytes: %s" "$IMG_NAME"
        du -h "$IMG_NAME"

    # ============================================================
    # 9. Mount RootFS & Configure Network
    - name: Mount RootFS & Add Network Config
      if: env.CHECK_BUILD_RESULT != 'true'
      run: |
        # Buat mount point
        sudo mkdir -p /tmp/rootfs
        
        echo "DEBUG: Checking filesystem on ${LOOP}p2 ..."
        sudo e2fsck -fy "${LOOP}p2" || true
        
        echo "DEBUG: Mounting rootfs read-write ..."
        sudo mount -o rw "${LOOP}p2" /tmp/rootfs
        
        sudo mkdir -p /tmp/rootfs/etc/config
        echo "DEBUG: Top-level rootfs directories:"
        sudo find /tmp/rootfs -maxdepth 1 -type d | sed 's/^/ - /'
        cat | sudo tee /tmp/rootfs/etc/config/network <<'EOF'
        config interface 'lan'
            option device 'eth0'
            option proto 'static'
            option ipaddr '192.168.1.2'
            option netmask '255.255.255.0'
        EOF
        
        cat | sudo tee /tmp/rootfs/etc/config/dhcp <<'EOF'
        config dhcp 'lan'
                option interface 'lan'
                option ignore '1'
        EOF
    
    # ============================================================
    # 11. Install OpenWrt Packages
    - name: Install OpenWrt Packages
      if: env.CHECK_BUILD_RESULT != 'true'
      run: |
        ROOTFS_DIR="/tmp/rootfs"
    
        # Paket lain (normal install)
        OPENWRT_PKGS=(
            bash curl ca-bundle wget ip-full ruby ruby-yaml kmod-tun kmod-inet-diag unzip kmod-nft-tproxy luci-compat luci luci-base lsblk
        )
    
        echo "=== Persiapan resolv.conf sementara ==="
        sudo rm -f "$ROOTFS_DIR/etc/resolv.conf"
        sudo sh -c "echo 'nameserver 8.8.8.8' > $ROOTFS_DIR/etc/resolv.conf"
        
        echo "=== Fix missing /var/lock dan /var/run ==="
        sudo mkdir -p "$ROOTFS_DIR/var/lock"
        sudo mkdir -p "$ROOTFS_DIR/var/run"
        
        echo "=== Mount /proc dan /sys untuk chroot ==="
        sudo mount --bind /proc "$ROOTFS_DIR/proc"
        sudo mount --bind /sys "$ROOTFS_DIR/sys"
        
        sudo cp "$ROOTFS_DIR/etc/opkg/distfeeds.conf" "$ROOTFS_DIR/etc/opkg/distfeeds.conf.bak"
        sudo sed -i 's|https://downloads.openwrt.org|http://downloads.openwrt.org|g' "$ROOTFS_DIR/etc/opkg/distfeeds.conf"
    
        sudo chroot "$ROOTFS_DIR" /bin/sh -c "
            echo '=== Update opkg ==='
            opkg update || true
    
            echo '=== Install dnsmasq-full dengan force-overwrite ==='
            opkg install dnsmasq-full --force-overwrite || true
    
            echo '=== Install paket normal ==='
            opkg install ${OPENWRT_PKGS[*]} || true
        "
        
        sudo mv "$ROOTFS_DIR/etc/opkg/distfeeds.conf.bak" "$ROOTFS_DIR/etc/opkg/distfeeds.conf"
    
        sudo umount "$ROOTFS_DIR/proc" || true
        sudo umount "$ROOTFS_DIR/sys" || true
        sudo rm -f "$ROOTFS_DIR/etc/resolv.conf"
    
        echo "===== INSTALL SELESAI ====="

    # ============================================================
    # 12. Unmount RootFS & Cleanup
    - name: Unmount RootFS & Detach Loop
      if: env.CHECK_BUILD_RESULT != 'true'
      run: |
        # Unmount rootfs jika masih ter-mount
        if mountpoint -q /tmp/rootfs; then
            sudo umount /tmp/rootfs
        fi
    
        # Detach loop device jika masih ada
        if [ -n "${LOOP}" ] && losetup "${LOOP}" >/dev/null 2>&1; then
            sudo losetup -d "${LOOP}"
        fi
    
        # Simpan hasil build
        mkdir -p build_artifacts
        cp "openwrt-x86-64-combined-ext4.img" build_artifacts/
        gzip -c "openwrt-x86-64-combined-ext4.img" > build_artifacts/"openwrt-x86-64-combined-ext4.img.gz"

    # ============================================================
    # 13. Generate release tag
    - name: Generate release tag
      if: env.CHECK_BUILD_RESULT != 'true'
      run: echo "RELEASE_TAG=v${{ env.LATEST }}-$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV

    # ============================================================
    # 14. Push git tag
    - name: Create and push git tag
      if: env.CHECK_BUILD_RESULT != 'true'
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git tag ${{ env.RELEASE_TAG }}
        git push origin ${{ env.RELEASE_TAG }}

    # ============================================================
    # 15. Upload firmware
    - name: Upload firmware
      if: env.CHECK_BUILD_RESULT != 'true'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: "OpenWrt x86_64 ${{ env.LATEST }} Build #${{ github.run_number }}"
        files: |
          # build_artifacts/openwrt-x86-64-combined-ext4.img
          build_artifacts/openwrt-x86-64-combined-ext4.img.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}