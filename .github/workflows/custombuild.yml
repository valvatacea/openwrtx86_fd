name: OpenWrt x86_64 Auto Build + USB-ready + IPK (Non-Interactive Fixed Loop)

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      GH_PAT: ${{ secrets.GH_PAT }}

    steps:
    # ============================================================
    # 1. Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # ============================================================
    # 2. Get latest OpenWrt version
    - name: Get latest OpenWrt version
      id: get_version
      run: |
        LATEST=$(curl -s https://downloads.openwrt.org/releases/ | grep -Po '([0-9]{2}\.[0-9]{2}\.[0-9]{1,2})/' | sort -V | tail -1 | tr -d '/')
        echo "LATEST=$LATEST" >> $GITHUB_ENV
        echo "Latest OpenWrt version: $LATEST"

    # ============================================================
    # 3. Check if version already built
    - name: Check if OpenWrt version already built
      id: check_build
      uses: actions/github-script@v6
      with:
        script: |
          const version = (process.env.LATEST || "").trim();
          const releases = await github.rest.repos.listReleases({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100
          });
          const exists = releases.data.some(r => r.tag_name.includes(version));
          require('fs').appendFileSync(process.env.GITHUB_ENV, `CHECK_BUILD_RESULT=${exists ? "true" : "false"}\n`);

    # ============================================================
    # 4. Install dependencies
    - name: Install dependencies
      if: env.CHECK_BUILD_RESULT != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y wget xz-utils squashfs-tools \
          qemu-utils dosfstools e2fsprogs parted rsync unzip file \
          build-essential gawk python3 curl git cloud-guest-utils \
          util-linux syslinux extlinux mtools grub-pc-bin \
          bzip2 lzma binfmt-support qemu-user-static kpartx

    # ============================================================
    # 5. Download OpenWrt Image
    - name: Download OpenWrt Image
      if: env.CHECK_BUILD_RESULT != 'true'
      run: |
        set -euxo pipefail
        cd $GITHUB_WORKSPACE
        LATEST=${{ env.LATEST }}
        IMG_URL="https://downloads.openwrt.org/releases/${LATEST}/targets/x86/generic/openwrt-${LATEST}-x86-generic-generic-ext4-combined.img.gz"
        IMG_NAME="openwrt-x86-64-combined-ext4.img"
        IMG_GZ="${IMG_NAME}.gz"

        echo "DEBUG: Downloading $IMG_URL"
        wget -q --show-progress "$IMG_URL" -O "$IMG_GZ"
        gunzip -f "$IMG_GZ" || true

    # ============================================================
    # 6. Debug Image Size Before Resize
    - name: Debug Image Size (Before Resize)
      if: env.CHECK_BUILD_RESULT != 'true'
      run: |
        IMG_NAME="openwrt-x86-64-combined-ext4.img"
        stat -c "File: %n | Bytes: %s" "$IMG_NAME"
        du -h "$IMG_NAME"

    # ============================================================
    # 7. Resize Image & Partition & Filesystem
    - name: Resize Image & Partition
      if: env.CHECK_BUILD_RESULT != 'true'
      run: |
        IMG_NAME="openwrt-x86-64-combined-ext4.img"
        TARGET_SIZE="1500M"
        LOOP=$(sudo losetup -f --show -P "$IMG_NAME")   # <- auto map partitions
        sudo qemu-img resize -f raw "$IMG_NAME" $TARGET_SIZE
        sudo parted "${LOOP}" -s resizepart 2 100%
        sudo partprobe "${LOOP}" || true
        sleep 1
        sudo e2fsck -fy "${LOOP}p2" || true
        sudo resize2fs "${LOOP}p2"

    # ============================================================
    # 8. Debug Image Size After Resize
    - name: Debug Image Size (After Resize)
      if: env.CHECK_BUILD_RESULT != 'true'
      run: |
        IMG_NAME="openwrt-x86-64-combined-ext4.img"
        stat -c "File: %n | Bytes: %s" "$IMG_NAME"
        du -h "$IMG_NAME"

    # ============================================================
    # 9. Mount RootFS & Configure Network
    - name: Mount RootFS & Add Network Config
      if: env.CHECK_BUILD_RESULT != 'true'
      run: |
        # Setup loop device & mount read-write
        LOOP=$(sudo losetup -f --show -P openwrt-x86-64-combined-ext4.img)
        echo "DEBUG: Checking filesystem on ${LOOP}p2 ..."
        sudo e2fsck -fy "${LOOP}p2" || true
        echo "DEBUG: Mounting rootfs read-write ..."
        sudo mount -o rw "${LOOP}p2" /tmp/rootfs
        
        sudo mkdir -p /tmp/rootfs/etc/config
        echo "DEBUG: Top-level rootfs directories:"
        sudo find /tmp/rootfs -maxdepth 1 -type d | sed 's/^/ - /'
        cat | sudo tee /tmp/rootfs/etc/config/network <<'EOF'
        config interface 'lan'
            option device 'eth0'
            option proto 'static'
            option ipaddr '192.168.1.2'
            option netmask '255.255.255.0'
        EOF

    # ============================================================
    # 11a. Remove dnsmasq from RootFS
    - name: Remove dnsmasq
      if: env.CHECK_BUILD_RESULT != 'true'
      run: |
        # Pastikan var/lock ada
        sudo mkdir -p /tmp/rootfs/var/lock
        
        echo "DEBUG: Removing dnsmasq package from rootfs"
        sudo chroot /tmp/rootfs opkg remove dnsmasq || true

    # ============================================================
    # 10. Install OpenWrt Packages Offline (Fixed)
    - name: Install OpenWrt Packages Offline
      if: env.CHECK_BUILD_RESULT != 'true'
      run: |
        # Buat direktori untuk IPK
        sudo mkdir -p /tmp/rootfs/tmp/ipk
    
        # Daftar paket OpenWrt
        OPENWRT_PKGS=(dnsmasq-full luci luci-base luci-compat bash curl ca-bundle ipset ip-full ruby ruby-yaml unzip iptables kmod-ipt-nat iptables-mod-tproxy iptables-mod-extra kmod-tun ip6tables-mod-nat kmod-inet-diag kmod-nft-tproxy kmod-usb-net-rndis kmod-usb-net-rtl8xxxu block-mount lsblk)
        URL="https://downloads.openwrt.org/releases/${{ env.LATEST }}/packages/x86_64/base/"
    
        # Download paket terbaru menggunakan curl & wget
        for PKG in "${OPENWRT_PKGS[@]}"; do
          FNAME=$(curl -s "$URL" | grep -Po "${PKG}_[0-9]+\.[0-9]+.*_x86_64\.ipk" | head -1)
          FNAME=${FNAME%%\"*}  # hapus karakter tambahan
          if [ -n "$FNAME" ]; then
            echo "Downloading $FNAME ..."
            wget -q -P /tmp/rootfs/tmp/ipk "${URL}${FNAME}" || true
          else
            echo "WARNING: Paket $PKG tidak ditemukan!"
          fi
        done
    
        # Install semua paket
        echo "DEBUG: Installing downloaded IPKs ..."
        sudo chroot /tmp/rootfs opkg install /tmp/ipk/*.ipk || true
    
        # Cleanup
        sudo umount /tmp/rootfs
        sudo losetup -d "${LOOP}"
        
    # ============================================================
    # 11b. Install GitHub IPK Offline (OpenClash & Theme)
    - name: Install GitHub IPK Offline
      if: env.CHECK_BUILD_RESULT != 'true'
      run: |
        GITHUB_IPK_LIST=(
          "https://github.com/vernesong/OpenClash/releases/download/v0.47.028/luci-app-openclash_0.47.028_all.ipk"
          "https://github.com/derisamedia/luci-theme-alpha/releases/download/alpha-4.0.1-beta/luci-theme-alpha4_4.0.1-beta-12_all.ipk"
        )
        sudo mkdir -p /tmp/rootfs/tmp
        sudo mkdir -p /tmp/rootfs/var/lock
        for url in "${GITHUB_IPK_LIST[@]}"; do
          fname=$(basename "$url")
          echo "Downloading $fname ..."
          wget -q -O "/tmp/rootfs/tmp/$fname" "$url" || true
          sudo chroot /tmp/rootfs opkg install /tmp/$fname || true
        done

    # ============================================================
    # 12. Unmount RootFS & Detach Loop
    - name: Unmount RootFS & Cleanup
      if: env.CHECK_BUILD_RESULT != 'true'
      run: |
        sudo umount /tmp/rootfs
        LOOP=$(losetup -a | grep "openwrt-x86-64-combined-ext4.img" | cut -d: -f1)
        sudo losetup -d "${LOOP}"
        mkdir -p build_artifacts
        cp "openwrt-x86-64-combined-ext4.img" build_artifacts/
        gzip -c "openwrt-x86-64-combined-ext4.img" > build_artifacts/"openwrt-x86-64-combined-ext4.img.gz"

    # ============================================================
    # 13. Generate release tag
    - name: Generate release tag
      if: env.CHECK_BUILD_RESULT != 'true'
      run: echo "RELEASE_TAG=v${{ env.LATEST }}-$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV

    # ============================================================
    # 14. Push git tag
    - name: Create and push git tag
      if: env.CHECK_BUILD_RESULT != 'true'
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git tag ${{ env.RELEASE_TAG }}
        git push origin ${{ env.RELEASE_TAG }}

    # ============================================================
    # 15. Upload firmware
    - name: Upload firmware
      if: env.CHECK_BUILD_RESULT != 'true'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: "OpenWrt x86_64 Mini 150MB ${{ env.LATEST }} Build #${{ github.run_number }}"
        files: |
          build_artifacts/openwrt-x86-64-combined-ext4.img
          build_artifacts/openwrt-x86-64-combined-ext4.img.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}