name: OpenWrt x86_64 Auto Build + USB-ready + IPK (Hybrid 1500MB)

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      GH_PAT: ${{ secrets.GH_PAT }}

    steps:
    # ================================================================
    # 1. Checkout repository
    # ================================================================
    - name: Checkout repository
      uses: actions/checkout@v4

    # ================================================================
    # 2. Get latest OpenWrt version
    # ================================================================
    - name: Get latest OpenWrt version
      id: get_version
      run: |
        LATEST=$(curl -s https://downloads.openwrt.org/releases/ | grep -Po '([0-9]{2}\.[0-9]{2}\.[0-9]{1,2})/' | sort -V | tail -1 | tr -d '/')
        echo "LATEST=$LATEST" >> $GITHUB_ENV
        echo "Latest OpenWrt version: $LATEST"

    # ================================================================
    # 3. Check if OpenWrt version already built
    # ================================================================
    - name: Check if OpenWrt version already built
      id: check_build
      uses: actions/github-script@v6
      with:
        script: |
          const version = (process.env.LATEST || "").trim();
          const releases = await github.rest.repos.listReleases({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100
          });
          const exists = releases.data.some(r => r.tag_name.includes(version));
          console.log("OpenWrt version already built?", exists);
          require('fs').appendFileSync(process.env.GITHUB_ENV, `CHECK_BUILD_RESULT=${exists ? "true" : "false"}\n`);

    - name: Debug check_build
      run: |
        echo "LATEST=$LATEST"
        echo "CHECK_BUILD_RESULT=$CHECK_BUILD_RESULT"

    # ================================================================
    # 4. Install dependencies
    # ================================================================
    - name: Install dependencies
      if: env.CHECK_BUILD_RESULT != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y wget xz-utils squashfs-tools \
          qemu-utils dosfstools e2fsprogs parted rsync unzip file \
          build-essential gawk python3 curl git cloud-guest-utils \
          util-linux syslinux extlinux mtools grub-pc-bin \
          bzip2 lzma binfmt-support qemu-user-static

    # ================================================================
    # 5. Hybrid build: Resize official combined-ext4 image
    # ================================================================
    - name: Hybrid Resize combined-ext4 image and add custom files/IPK
      if: env.CHECK_BUILD_RESULT != 'true'
      run: |
        set -euxo pipefail
        cd $GITHUB_WORKSPACE

        LATEST=${{ env.LATEST }}
        IMG_URL="https://downloads.openwrt.org/releases/${LATEST}/targets/x86/generic/openwrt-${LATEST}-x86-generic-generic-ext4-combined.img.gz"
        IMG_NAME="openwrt-x86-64-combined-ext4.img"
        IMG_GZ="${IMG_NAME}.gz"
        TARGET_SIZE="1500M"

        # Download and decompress official image
        wget -q --show-progress "$IMG_URL" -O "$IMG_GZ"
        gunzip -f "$IMG_GZ" || true

        # Resize image to 1500MB
        sudo qemu-img resize "$IMG_NAME" $TARGET_SIZE

        # Setup loop device
        LOOP=$(sudo losetup -f --show -P "$IMG_NAME")
        mkdir -p /tmp/rootfs
        sudo mount "${LOOP}p1" /tmp/rootfs || sudo mount "$LOOP" /tmp/rootfs

        # Add custom files
        sudo mkdir -p /tmp/rootfs/etc/config /tmp/rootfs/etc/init.d /tmp/rootfs/etc/uci-defaults /tmp/rootfs/tmp/ipk

        cat | sudo tee /tmp/rootfs/etc/config/network <<'EOF'
        config interface 'loopback'
            option device 'lo'
            option proto 'static'
            option ipaddr '127.0.0.1'
            option netmask '255.0.0.0'
        config interface 'lan'
            option device 'eth0'
            option proto 'static'
            option ipaddr '192.168.1.2'
            option netmask '255.255.255.0'
        config interface 'usb0'
            option proto 'dhcp'
        EOF

        cat | sudo tee /tmp/rootfs/etc/init.d/resize-rootfs <<'EOF'
        #!/bin/sh /etc/rc.common
        START=99
        start() {
            [ -f /etc/.rootfs_resized ] && exit 0
            ROOTDEV=$(mount | grep " on / " | awk '{print $1}')
            PARTBASE=$(echo $ROOTDEV | sed 's/[0-9]*$//')
            PARTNUM=$(echo $ROOTDEV | grep -o '[0-9]*$')
            if command -v growpart >/dev/null 2>&1; then
                growpart $PARTBASE $PARTNUM || true
            fi
            resize2fs $ROOTDEV || true
            touch /etc/.rootfs_resized
        }
        EOF
        sudo chmod +x /tmp/rootfs/etc/init.d/resize-rootfs

        cat | sudo tee /tmp/rootfs/etc/uci-defaults/99-install-ipk <<'EOF'
        #!/bin/sh
        IPK_DIR="/tmp/ipk"
        if [ -d "$IPK_DIR" ]; then
          for f in "$IPK_DIR"/*.ipk; do
            [ -f "$f" ] && opkg install "$f"
          done
        fi
        EOF
        sudo chmod +x /tmp/rootfs/etc/uci-defaults/99-install-ipk

        # Download sample IPKs
        sudo wget -O /tmp/rootfs/tmp/ipk/luci-theme-alpha4.ipk \
          https://github.com/derisamedia/luci-theme-alpha/releases/download/alpha-4.0.1-beta/luci-theme-alpha4_4.0.1-beta-12_all.ipk || true
        sudo wget -O /tmp/rootfs/tmp/ipk/luci-app-openclash.ipk \
          https://github.com/vernesong/OpenClash/releases/download/v0.47.028/luci-app-openclash_0.47.028_all.ipk || true

        # Sync and unmount
        sync
        sudo umount /tmp/rootfs
        sudo losetup -d "$LOOP"

        # Save artifacts
        mkdir -p $GITHUB_WORKSPACE/build_artifacts
        cp "$IMG_NAME" $GITHUB_WORKSPACE/build_artifacts/   # Simpan file .img asli
        gzip -c "$IMG_NAME" > "$IMG_GZ"
        mv "$IMG_GZ" $GITHUB_WORKSPACE/build_artifacts/

    # ================================================================
    # 6. Generate release tag
    # ================================================================
    - name: Generate release tag
      if: env.CHECK_BUILD_RESULT != 'true'
      run: echo "RELEASE_TAG=v${{ env.LATEST }}-$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV

    # ================================================================
    # 7. Create and push Git tag
    # ================================================================
    - name: Create and push Git tag
      if: env.CHECK_BUILD_RESULT != 'true'
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git tag ${{ env.RELEASE_TAG }}
        git push origin ${{ env.RELEASE_TAG }}

    # ================================================================
    # 8. Create GitHub Release & upload firmware (both .img and .img.gz)
    # ================================================================
    - name: Create GitHub Release and upload firmware
      if: env.CHECK_BUILD_RESULT != 'true'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: "OpenWrt x86_64 hybrid combined-ext4 1500MB ${{ env.LATEST }} Build #${{ github.run_number }}"
        files: |
          build_artifacts/openwrt-x86-64-combined-ext4.img
          build_artifacts/openwrt-x86-64-combined-ext4.img.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}