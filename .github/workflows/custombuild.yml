name: OpenWrt x86_64 Auto Build + USB-ready + IPK (Mini 150MB Non-Interactive)

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"  # Build otomatis jam 03:00 UTC tiap hari

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # Timeout 6 jam

    env:
      GH_PAT: ${{ secrets.GH_PAT }}  # Token GitHub untuk upload release

    steps:
    # ============================================================
    # 1. CLONE REPOSITORY
    # ============================================================
    - name: Checkout repository
      uses: actions/checkout@v4

    # ============================================================
    # 2. AMBIL VERSI OPENWRT PALING BARU
    # ============================================================
    - name: Get latest OpenWrt version
      id: get_version
      run: |
        # Ambil list folder versi → pakai regex angka angka angka
        LATEST=$(curl -s https://downloads.openwrt.org/releases/ | grep -Po '([0-9]{2}\.[0-9]{2}\.[0-9]{1,2})/' | sort -V | tail -1 | tr -d '/')

        echo "LATEST=$LATEST" >> $GITHUB_ENV
        echo "Latest OpenWrt version: $LATEST"

    # ============================================================
    # 3. CEK APA SUDAH ADA RELEASE VERSI INI?
    # ============================================================
    - name: Check if OpenWrt version already built
      id: check_build
      uses: actions/github-script@v6
      with:
        script: |
          const version = (process.env.LATEST || "").trim();

          const releases = await github.rest.repos.listReleases({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100
          });

          const exists = releases.data.some(r => r.tag_name.includes(version));

          require('fs').appendFileSync(process.env.GITHUB_ENV,
            `CHECK_BUILD_RESULT=${exists ? "true" : "false"}\n`
          );

    # ============================================================
    # 4. INSTALL DEPENDENCIES
    # ============================================================
    - name: Install dependencies
      if: env.CHECK_BUILD_RESULT != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y wget xz-utils squashfs-tools \
          qemu-utils dosfstools e2fsprogs parted rsync unzip file \
          build-essential gawk python3 curl git cloud-guest-utils \
          util-linux syslinux extlinux mtools grub-pc-bin \
          bzip2 lzma binfmt-support qemu-user-static

    # ============================================================
    # 5. DOWNLOAD IMAGE + RESIZE + INJECT CONFIG + IPK ARRAY
    # ============================================================
    - name: Download + Modify + Resize Partition
      if: env.CHECK_BUILD_RESULT != 'true'
      run: |
        set -euxo pipefail
        cd $GITHUB_WORKSPACE

        LATEST=${{ env.LATEST }}

        # ============
        # URL IMAGE
        # ============
        IMG_URL="https://downloads.openwrt.org/releases/${LATEST}/targets/x86/generic/openwrt-${LATEST}-x86-generic-generic-ext4-combined.img.gz"
        IMG_NAME="openwrt-x86-64-combined-ext4.img"
        IMG_GZ="${IMG_NAME}.gz"
        TARGET_SIZE="1800M"

        # ============
        # DOWNLOAD DAN EXTRACT
        # ============
        wget -q --show-progress "$IMG_URL" -O "$IMG_GZ"
        gunzip -f "$IMG_GZ" || true

        # ============
        # RESIZE RAW IMAGE
        # ============
        sudo qemu-img resize -f raw "$IMG_NAME" $TARGET_SIZE

        # Attach image → dapat loopNp1, loopNp2
        LOOP=$(sudo losetup -f --show -P "$IMG_NAME")

        echo "Before resize:"
        sudo lsblk "${LOOP}"

        # Resize partisi root (p2)
        sudo parted "${LOOP}" -s resizepart 2 100% || {
          sudo partprobe "${LOOP}" || true
          sudo parted "${LOOP}" -s resizepart 2 100%
        }

        sudo partprobe "${LOOP}" || true
        sleep 1

        # ============
        # RESIZE EXT4
        # ============
        sudo e2fsck -fy "${LOOP}p2" || true
        sudo resize2fs "${LOOP}p2"

        # Mount rootfs
        mkdir -p /tmp/rootfs
        sudo mount "${LOOP}p2" /tmp/rootfs

        sudo mkdir -p /tmp/rootfs/tmp/ipk /tmp/rootfs/etc/config

        # ============
        # NETWORK CONFIG
        # ============
        cat | sudo tee /tmp/rootfs/etc/config/network <<'EOF'
        config interface 'lan'
            option device 'eth0'
            option proto 'static'
            option ipaddr '192.168.1.2'
            option netmask '255.255.255.0'
        EOF

        # ============
        # ARRAY IPK
        # ============
        IPK_LIST=(
          "https://github.com/derisamedia/luci-theme-alpha/releases/download/alpha-4.0.1-beta/luci-theme-alpha4_4.0.1-beta-12_all.ipk"
          "https://github.com/vernesong/OpenClash/releases/download/v0.47.028/luci-app-openclash_0.47.028_all.ipk"
        )

        # DOWNLOAD SEMUA IPK SEBAGAI LOOP
        for url in "${IPK_LIST[@]}"; do
          fname=$(basename "$url")
          echo "Downloading IPK → $fname"
          sudo wget -O "/tmp/rootfs/tmp/ipk/$fname" "$url" || true
        done

        # ============
        # AUTO-INSTALL IPK SAAT FIRST BOOT
        # ============
        cat | sudo tee /tmp/rootfs/etc/uci-defaults/99-install-ipk <<'EOF'
        #!/bin/sh
        for f in /tmp/ipk/*.ipk; do
            [ -f "$f" ] && opkg install "$f"
        done
        EOF
        sudo chmod +x /tmp/rootfs/etc/uci-defaults/99-install-ipk

        # Unmount + detach
        sync
        sudo umount /tmp/rootfs
        sudo losetup -d "${LOOP}"

        mkdir -p build_artifacts
        cp "$IMG_NAME" build_artifacts/
        gzip -c "$IMG_NAME" > build_artifacts/"${IMG_NAME}.gz"

    # ============================================================
    # 6. BUAT TAG RELEASE
    # ============================================================
    - name: Generate release tag
      if: env.CHECK_BUILD_RESULT != 'true'
      run: echo "RELEASE_TAG=v${{ env.LATEST }}-$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV

    # ============================================================
    # 7. PUSH GIT TAG
    # ============================================================
    - name: Create and push git tag
      if: env.CHECK_BUILD_RESULT != 'true'
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git tag ${{ env.RELEASE_TAG }}
        git push origin ${{ env.RELEASE_TAG }}

    # ============================================================
    # 8. UPLOAD KE RELEASE
    # ============================================================
    - name: Upload firmware
      if: env.CHECK_BUILD_RESULT != 'true'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: "OpenWrt x86_64 Mini 150MB ${{ env.LATEST }} Build #${{ github.run_number }}"
        files: |
          build_artifacts/openwrt-x86-64-combined-ext4.img
          build_artifacts/openwrt-x86-64-combined-ext4.img.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}